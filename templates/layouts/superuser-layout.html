<!DOCTYPE html>
<html lang="es">
{% load static %}
{% load i18n %}
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title_page %}Superusuario{% endblock title_page %}</title>
    <link rel="shortcut icon" type="image/x-icon" href="{% static '/img-aptos/apartamento-ico.ico' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/font-awesome.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style-admin.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light" style="min-height: 100vh;">
    <!-- Barra superior solo para superusuario: sin menú admin -->
    <header class="bg-primary text-white shadow-sm">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center py-3">
                <div class="d-flex align-items-center">
                    <h5 class="mb-0 me-3">Panel Superusuario</h5>
                    <a href="/" class="text-white text-decoration-none me-3"><i class="fa fa-home"></i> Inicio</a>
                </div>
                <div>
                    <a href="{% url 'condominio_app:cerrar_sesion' %}" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container-fluid py-4">
        {% block body_block %}
        {% endblock body_block %}
    </main>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="{% static '/js/bootstrap.min.js' %}" defer></script>
    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
